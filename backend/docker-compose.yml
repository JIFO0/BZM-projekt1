services:
  # 1. Expo Mobile Web Frontend (Production Caddy container)
  frontend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.frontend
    container_name: krakow-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - krakow-net

  # 2. API Backend (Hono / Node.js CLI server)
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile.api
    container_name: krakow-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    expose:
      - "3000"
    ports:
      - "3000:3000"
    networks:
      - krakow-net

  # 3. GraphHopper Routing Engine (Self-hosted pedestrian router with custom models)
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: krakow-graphhopper
    restart: unless-stopped
    ports:
      - "8989:8989"
    expose:
      - "8989"
    environment:
      - JAVA_OPTS=-Xmx2g -Xms1g
    volumes:
      - ./config.yml:/config.yml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./data:/data
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - krakow-net

  # 4. Ingress Gateway & Reverse Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: krakow-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - api
      - graphhopper
    networks:
      - krakow-net

networks:
  krakow-net:
    driver: bridge
